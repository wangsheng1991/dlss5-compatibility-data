name: validate
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: No non-unknown status without an official source
        run: node scripts/validate.mjs
      - name: CLI smoke test
        run: node scripts/check.mjs "rtx 4070" && node scripts/check.mjs "9070 xt" --json > /dev/null
